name: Instagram media

# When job photos are pushed to instagram/photos/ (named post31_1.jpg, post31_2.jpg, ...),
# build the branded carousel images or Reel video for those posts and commit them to
# instagram/media/, ready for the publisher.
on:
  push:
    branches: [main]
    paths:
      - 'instagram/photos/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-media
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet pillow
      - name: Build media
        run: python3 instagram/tools/build_media.py
      - name: Commit built media
        run: |
          if [ -n "$(git status --porcelain instagram/media instagram/posts.json)" ]; then
            git config user.name "sbc-instagram-bot"
            git config user.email "sbc-instagram-bot@users.noreply.github.com"
            git add instagram/media instagram/posts.json
            git commit -m "Build Instagram media from new photos"
            git push
          else
            echo "Nothing new to build."
          fi
