name: Build and deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Validate prerendered output
        run: |
          test -f dist/index.html
          test -f dist/pricing/index.html
          test -f dist/basement-finishing/berthoud/index.html || test -f dist/basement-finishing/berthoud-co/index.html
          grep -q 'Basement finishing' dist/pricing/index.html
          grep -q '175' dist/pricing/index.html
          test -f dist/sitemap.xml
          grep -q '/pricing/' dist/sitemap.xml
          test -f dist/robots.txt
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
