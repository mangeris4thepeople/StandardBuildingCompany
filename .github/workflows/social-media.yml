name: Social media builder

# When job photos are pushed to social/<platform>/photos/ (named post31_1.jpg, post31_2.jpg, ...),
# build the branded images or Reel video for those posts, record them in posts.json, and commit.
on:
  push:
    branches: [main]
    paths:
      - 'social/*/photos/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-media-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet pillow
      - name: Build media
        run: |
          for p in instagram facebook linkedin; do python3 social/tools/build_media.py "$p"; done
      - name: Commit built media
        run: |
          if [ -n "$(git status --porcelain social)" ]; then
            git config user.name "sbc-social-bot"
            git config user.email "sbc-social-bot@users.noreply.github.com"
            git add social
            git commit -m "Build social media from new photos"
            git push
          else
            echo "Nothing new to build."
          fi
