name: Instagram publisher

# Publishes Standard Building Company Instagram posts from instagram/posts.json.
# Runs hourly; instagram/tools/publish.py posts anything whose time has passed in the last
# 20 hours and is not already on the account, so a late or skipped run catches up.
# Needs repository secrets IG_USER_ID and IG_ACCESS_TOKEN (see instagram/README.md).
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list what would be published'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Publish due posts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          if [ -z "$IG_USER_ID" ] || [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "Instagram secrets are not set yet; listing the queue only."
            export DRY_RUN=1
          fi
          python3 instagram/tools/publish.py
